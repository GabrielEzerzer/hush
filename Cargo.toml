[package]
name = "hush"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Per-project encrypted secrets, injected into apps at runtime"
publish = false

[dependencies]
anyhow = "1"
chacha20poly1305 = "0.10"
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "6"
dotenvy = "0.15"
hex = "0.4"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.9"
which = "8"
zeroize = "1"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3.6", features = ["windows-native", "apple-native"] }

[target.'cfg(windows)'.dependencies]
ctrlc = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
