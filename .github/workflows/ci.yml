name: CI

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Comment-ban lint
        env:
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet ast-grep-cli==0.51.1
          PATH="$RUNNER_TEMP/lint/bin:$PATH" python3 setup/lint/ratchet --base "origin/$BASE"
      - name: Lint rule tests
        run: PATH="$RUNNER_TEMP/lint/bin:$PATH" python3 -m unittest discover -s setup/lint/tests

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Acceptance scenarios
        if: runner.os == 'Linux'
        run: |
          cargo build --locked
          python3 harness/acceptance.py --hush target/debug/hush
          python3 harness/acceptance.py --set test --hush target/debug/hush
      - name: Secret Service keyring
        if: runner.os == 'Linux'
        run: |
          if ldd target/debug/hush | grep libdbus; then echo "hush links libdbus dynamically"; exit 1; fi
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends dbus gnome-keyring libsecret-tools
          dbus-run-session -- sh -c 'printf throwaway | gnome-keyring-daemon --daemonize --unlock --components=secrets > /dev/null && python3 harness/secret_service.py target/debug/hush'
